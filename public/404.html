<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page introuvable | Bomengo Ya Mwasi</title>
  <style>
    :root { --ink: #241d28; --muted: #756b78; --pink: #d13373; --line: #eadce5; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font-family: Arial, sans-serif; color: var(--ink); background: linear-gradient(135deg, #fff8fb, #f2efff); }
    main { width: min(520px, 100%); padding: 48px 32px; text-align: center; background: #fff; border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 20px 50px #3f273a12; }
    h1 { margin: 0 0 12px; color: var(--pink); font-size: 4rem; }
    h2 { margin: 0 0 12px; }
    p { color: var(--muted); line-height: 1.6; }
    a { display: inline-block; margin-top: 16px; padding: 12px 18px; border-radius: 8px; background: var(--pink); color: #fff; font-weight: bold; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <h2>Page introuvable</h2>
    <p>La page demandée n'existe pas ou n'est plus disponible.</p>
    <a href="/">Retour à l'accueil</a>
  </main>
</body>
</html>
